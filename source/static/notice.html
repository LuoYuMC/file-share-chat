<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; font-size: 14px; color: #1f2937; background: #f1f5f9; }
  .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .notice { width: 100%; max-width: 560px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 28px; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
  h1 { margin: 0 0 12px; font-size: 18px; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; color: #374151; margin-bottom: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 13px; color: #374151; }
  .row { display: flex; gap: 12px; align-items: center; }
  .row input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
  .row input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, .15); }
  .btn { display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; border: 0; border-radius: 6px; background: #1e40af; color: #fff; font: inherit; text-decoration: none; cursor: pointer; width: 100%; }
  .btn:hover { background: #1d4ed8; }
  .btn.ghost { background: #e5e7eb; color: #1f2937; width: auto; flex-shrink: 0; }
  .btn.ghost:hover { background: #d1d5db; }
  .btn.disabled { background: #9ca3af; cursor: not-allowed; pointer-events: none; }
  .hint { color: #6b7280; font-size: 12px; line-height: 1.6; margin-top: 6px; word-break: break-all; }
  .html { display: block; width: 100%; height: 50vh; min-height: 240px; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; margin-bottom: 20px; }
  hr { border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0; }
</style>
</head>
<body>
<main class="wrap">
  <section class="notice">
    <h1>提示</h1>
    {{if .HTML}}<iframe class="html" sandbox="allow-scripts allow-popups" srcdoc="{{.Message}}"></iframe>{{else}}<div class="body">{{.Message}}</div>{{end}}

    <form id="visitForm">
      <div class="field">
        <label for="addr">访问地址（输入域名或 IP，回车或点击访问）</label>
        <div class="row">
          <input id="addr" type="text" autocomplete="off" placeholder="例如 example.com、192.168.1.20:8080">
          <button class="btn ghost" type="submit">访问</button>
        </div>
        <div class="hint">域名或 IP 将直接访问（http://）；带协议的完整地址原样打开；其他内容使用 Bing 搜索。</div>
      </div>
    </form>

    <hr>

    <div class="field">
      {{if .Target}}<a class="btn" href="{{.Target}}">前往聊天</a>
      <div class="hint">目标：{{.Target}}（由主副管理员设置）</div>
      {{else}}<span class="btn disabled">前往聊天</span>
      <div class="hint">管理员尚未设置聊天地址。</div>
      {{end}}
    </div>
  </section>
</main>
<script>
(function () {
  function targetOf(t) {
    t = t.trim();
    if (!t) return '';
    if (/^https?:\/\//i.test(t)) return t;
    var host = t.split(/[\/?#]/)[0];
    var isIP = /^(\d{1,3}\.){3}\d{1,3}(:\d{1,5})?$/.test(host);
    var isDomain = /^([a-z0-9-]+\.)+[a-z]{2,}(:\d{1,5})?$/i.test(host);
    var isLocal = /^localhost(:\d{1,5})?$/i.test(host);
    if (isIP || isDomain || isLocal) return 'http://' + t;
    return 'https://www.bing.com/search?q=' + encodeURIComponent(t);
  }
  document.getElementById('visitForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var url = targetOf(document.getElementById('addr').value);
    if (url) window.location.href = url;
  });
})();
</script>
</body>
</html>
